apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: codes-cite
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: php
        image: codes-cite:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: codes-cite-config
              key: DB_HOST
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: codes-cite-config
              key: DB_NAME
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: codes-cite-config
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: codes-cite-secrets
              key: DB_PASSWORD
        volumeMounts:
        - name: uploads
          mountPath: /var/www/html/uploads
      volumes:
      - name: uploads
        emptyDir: {}
